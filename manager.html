<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaxiQaid - Manager Mode</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #222;
      height: 100vh;
      height: 100dvh;
    }

    header {
      flex: 0 0 auto;
      padding: 12px 22px;
      background: #F58220;
      color: white;
    }

    .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      background: white;
      border-radius: 5px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .controles {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .grupo {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
    }

    select,
    button {
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
    }

    select {
      border: 1px solid #ddd;
      background: white;
      color: #222;
    }

    button {
      cursor: pointer;
      border: 1px solid white;
      background: white;
      color: #B9570A;
      font-weight: bold;
    }

    button:hover {
      background: #fff0e3;
    }

    #backToManager {
      min-width: 125px;
    }

    #selector {
      min-width: 105px;
    }

    #yearSelector {
      min-width: 90px;
    }

    #monthSelector {
      min-width: 125px;
    }

    #optionSelector {
      min-width: 125px;
    }

    #estado {
      font-size: 13px;
      margin-top: 8px;
    }

    #resumen {
      font-size: 13px;
      margin-top: 4px;
    }

    #map {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: #e5e5e5;
    }

    /* Heatmap legend, matching OCC Mode */
.leyenda {
  background: white;
  padding: 8px 10px;
  line-height: 1.5;
  font-size: 12px;
  box-shadow: 0 1px 5px #999;
  border-radius: 5px;
  color: #222;
  min-width: 150px;
}

.muestra {
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 5px;
  vertical-align: middle;
  border: 1px solid #777;
  border-radius: 2px;
}

    @media (max-width: 650px) {
      header {
        padding: 10px 12px;
        max-height: 48vh;
        overflow-y: auto;
      }

      .cabecera {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .marca {
        gap: 10px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      h1 {
        font-size: 18px;
      }

      .controles {
        width: 100%;
        align-items: stretch;
        gap: 8px;
      }

      .grupo {
        flex: 1 1 110px;
        min-width: 0;
      }

      select,
      button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="cabecera">

      <div class="marca">
        <img
          class="logo"
          src="./TaxiQaidLogo.jpg"
          alt="TaxiQaid Logo"
        >

        <h1>MANAGER MODE</h1>
      </div>

      <div class="controles">

        <div class="grupo">
          <label>&nbsp;</label>
          <button id="backToManager">OCC Mode</button>
        </div>

        <div class="grupo">
          <label for="selector">Select Hour:</label>
          <select id="selector">
            <option value="Total" selected>Total</option>
          </select>
        </div>

        <div class="grupo">
          <label for="yearSelector">Year:</label>
          <select id="yearSelector">
            <option value="2026" selected>2026</option>
          </select>
        </div>

        <div class="grupo">
  <label for="monthSelector">Month:</label>
  <select id="monthSelector">
    <option value="5" selected>May</option>
  </select>
</div>

        <div class="grupo">
          <label for="optionSelector">Option:</label>
          <select id="optionSelector">
            <option value="Pick-Up" selected>Pick-Up</option>
            <option value="Drop-Off">Drop-Off</option>
            <option value="Total Trips">Total Trips</option>
          </select>
        </div>

      </div>
    </div>

    <div id="estado">Initializing map...</div>
    <div id="resumen"></div>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    // QGIS Cloud service, retained for the next integration stage.
    // QGIS Cloud service.
const servicio =
  "https://wms.prod.qgiscloud.com/dohanyan16/TaxiQaid_Demand_Analysis";

// QGIS Cloud layers for May 2026.
const catalogoCapas = {
  "2026": {
    "5": {
      name: "May",
      layers: {
        "Pick-Up": "05_May_2026_-_Pick-Up",
        "Drop-Off": "05_May_2026_-_Drop-Off",
        "Total Trips": "05_May_2026_-_Total"
      }
    },

    "6": {
      name: "June",
      layers: {
        "Pick-Up": "06_June_2026_-_Pick-Up",
        "Drop-Off": "06_June_2026_-_Drop-Off",
        "Total Trips": "06_June_2026_-_Total"
      }
    },
    "7": {
      name: "July",
      layers: {
        "Pick-Up": "07_July_2026_-_Pick-Up",
        "Drop-Off": "07_July_2026_-_Drop-Off",
        "Total Trips": "07_July_2026_-_Total"
      }
    },
    "8": {
      name: "August",
      layers: {
        "Pick-Up": "08_August_2026_-_Pick-Up",
        "Drop-Off": "08_August_2026_-_Drop-Off",
        "Total Trips": "08_August_2026_-_Total"
      }
    },
    "9": {
      name: "September",
      layers: {
        "Pick-Up": "09_September_2026_-_Pick-Up",
        "Drop-Off": "09_September_2026_-_Drop-Off",
        "Total Trips": "09_September_2026_-_Total"
      }
    }
  }
};

    const mapa = L.map("map", {
      center: [21.3891, 39.8579],
      zoom: 12
    });

    // Satellite basemap.
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Imagery &copy; Esri",
        maxZoom: 19
      }
    ).addTo(mapa);

    const selector = document.getElementById("selector");
    const yearSelector = document.getElementById("yearSelector");
    const monthSelector = document.getElementById("monthSelector");
    const optionSelector = document.getElementById("optionSelector");
    const estado = document.getElementById("estado");
    const resumen = document.getElementById("resumen");

    // Populate the hour selector, including Total.
    selector.replaceChildren();

    const opcionTotal = document.createElement("option");
    opcionTotal.value = "Total";
    opcionTotal.textContent = "Total";
    opcionTotal.selected = true;
    selector.appendChild(opcionTotal);

    for (let h = 0; h < 24; h++) {
      const hora = String(h).padStart(2, "0");
      const campo = hora + "_00";
      const opcion = document.createElement("option");

      opcion.value = campo;
      opcion.textContent = hora + ":00";

      selector.appendChild(opcion);
    }

    function rellenarSelectoresFecha() {
  yearSelector.replaceChildren();
  monthSelector.replaceChildren();

  const years = Object.keys(catalogoCapas)
    .sort((a, b) => Number(a) - Number(b));

  years.forEach(year => {
    const option = document.createElement("option");

    option.value = year;
    option.textContent = year;

    yearSelector.appendChild(option);
  });

  function actualizarMeses() {
    const year = yearSelector.value;
    const meses = catalogoCapas[year] || {};

    monthSelector.replaceChildren();

    const monthNumbers = Object.keys(meses)
      .sort((a, b) => Number(a) - Number(b));

    monthNumbers.forEach(month => {
      const option = document.createElement("option");

      option.value = month;
      option.textContent = meses[month].name;

      monthSelector.appendChild(option);
    });
  }

  yearSelector.addEventListener("change", () => {
    actualizarMeses();
    actualizarSeleccion();
  });

  actualizarMeses();
}

    // Return to the repository's occmanager.html page.
    document.getElementById("backToManager")
      .addEventListener("click", () => {
        window.location.href = "./occmanager.html";
      });

    // Initial grey style.
const estiloInicial = {
  color: "#555555",
  weight: 0.8,
  fillColor: "#808080",
  fillOpacity: 0.5
};

// Pick-Up: green palette.
const coloresPickUp = [
  "#f7fcf5",
  "#e5f5e0",
  "#c7e9c0",
  "#a1d99b",
  "#74c476",
  "#41ab5d",
  "#238b45",
  "#006d2c",
  "#005a24",
  "#003d19"
];

// Drop-Off: red palette.
const coloresDropOff = [
  "#fff5f0",
  "#fee0d2",
  "#fcbba1",
  "#fc9272",
  "#fb6a4a",
  "#ef3b2c",
  "#cb181d",
  "#a50f15",
  "#67000d",
  "#3b0008"
];

// Total Trips: blue palette.
const coloresTotalTrips = [
  "#f7fbff",
  "#deebf7",
  "#c6dbef",
  "#9ecae1",
  "#6baed6",
  "#4292c6",
  "#2171b5",
  "#08519c",
  "#08306b",
  "#041f4a"
];

const paletas = {
  "Pick-Up": coloresPickUp,
  "Drop-Off": coloresDropOff,
  "Total Trips": coloresTotalTrips
};

// Current map state.
let datosGeoJSON = null;
let capaMapa = null;
let controlLeyenda = null;
let mapaInicializado = false;
let filtrosAplicados = null;
let numeroSolicitud = 0;

// Cache downloaded layers.
const cacheCapas = new Map();
    
    // Collect the current filter selections.
    function obtenerFiltros() {
      return {
        hour: selector.value,
        year: yearSelector.value,
        month: monthSelector.value,
        option: optionSelector.value
      };
    }

    function obtenerNombreCapa(filtros) {
  const periodo =
    catalogoCapas[filtros.year]?.[filtros.month];

  if (!periodo) {
    throw new Error(
      "No data configured for the selected year and month."
    );
  }

  const nombre = periodo.layers[filtros.option];

  if (!nombre) {
    throw new Error(
      "No QGIS layer configured for this option."
    );
  }

  return nombre;
}

function obtenerCampo(filtros) {
  return filtros.hour === "Total" ? "total" : filtros.hour;
}

function obtenerValor(propiedades, campo) {
  const original = propiedades?.[campo];

  if (
    original === null ||
    original === undefined ||
    String(original).trim() === ""
  ) {
    return null;
  }

  const valor = Number(original);

  return Number.isFinite(valor) && valor >= 0 ? valor : null;
}

function escaparHTML(valor) {
  return String(valor).replace(/[&<>"']/g, caracter => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[caracter]);
}

function crearCortes(valores) {
  const ordenados = [...valores].sort((a, b) => a - b);

  if (!ordenados.length) return [];

  return Array.from({ length: 9 }, (_, i) => {
    const indice = Math.floor(
      (ordenados.length - 1) * ((i + 1) / 10)
    );

    return ordenados[indice];
  });
}

function obtenerIndice(valor, cortes) {
  if (valor === null || !cortes.length) return -1;

  const indice = cortes.findIndex(corte => valor <= corte);

  return indice === -1 ? 9 : indice;
}


    async function cargarCapaQGIS(nombreCapa) {
  if (cacheCapas.has(nombreCapa)) {
    return cacheCapas.get(nombreCapa);
  }

  const parametros = new URLSearchParams({
    service: "WFS",
    version: "1.1.0",
    request: "GetFeature",
    typeName: nombreCapa,
    outputFormat: "application/json"
  });

  const respuesta = await fetch(
    servicio + "?" + parametros.toString()
  );

  const texto = await respuesta.text();

  if (!respuesta.ok) {
    throw new Error(
      "HTTP " + respuesta.status + " loading " + nombreCapa
    );
  }

  let geojson;

  try {
    geojson = JSON.parse(texto);
  } catch (error) {
    throw new Error(
      "Invalid JSON returned by QGIS Cloud: " + texto.slice(0, 200)
    );
  }

  if (
    !geojson ||
    !Array.isArray(geojson.features) ||
    geojson.features.length === 0
  ) {
    throw new Error("No features returned for " + nombreCapa);
  }

  const campos = new Set(
    geojson.features.flatMap(feature =>
      Object.keys(feature.properties ?? {})
    )
  );

  if (!campos.has("name")) {
    throw new Error('The layer is missing the "name" field.');
  }

  cacheCapas.set(nombreCapa, geojson);

  return geojson;
}

    function mostrarMapaInicial(geojson) {
  if (capaMapa) {
    mapa.removeLayer(capaMapa);
  }

  capaMapa = L.geoJSON(geojson, {
    style: () => estiloInicial,

    onEachFeature: (feature, layer) => {
      const nombre = feature.properties?.name ?? "Unnamed zone";
      layer.bindPopup("<b>" + escaparHTML(nombre) + "</b>");
    }
  }).addTo(mapa);

  if (controlLeyenda) {
    mapa.removeControl(controlLeyenda);
    controlLeyenda = null;
  }

  mapaInicializado = true;
  datosGeoJSON = geojson;

  const limites = capaMapa.getBounds();

  if (limites.isValid()) {
    mapa.fitBounds(limites, { padding: [15, 15] });
  }

  estado.textContent =
    "Data loaded. Change a filter to update the analysis.";

  actualizarResumen(obtenerFiltros());
}

function crearLeyenda(valores, cortes, colores, titulo) {
  if (controlLeyenda) {
    mapa.removeControl(controlLeyenda);
    controlLeyenda = null;
  }

  controlLeyenda = L.control({ position: "bottomright" });

  controlLeyenda.onAdd = function () {
    const div = L.DomUtil.create("div", "leyenda");

    let html =
      "<b style='display:block;margin-bottom:5px'>" +
      escaparHTML(titulo) + "</b>";

    if (!valores.length || !cortes.length) {
      html += "No data available";
    } else {
      for (let i = 0; i < 10; i++) {
        let etiqueta;

        if (i === 0) {
          etiqueta = "≤ " + cortes[0];
        } else if (i === 9) {
          etiqueta = "> " + cortes[8];
        } else {
          etiqueta =
            "> " + cortes[i - 1] + " – ≤ " + cortes[i];
        }

        html +=
          '<span class="muestra" style="background:' +
          colores[i] + '"></span>' +
          etiqueta + "<br>";
      }
    }

    div.innerHTML = html;
    L.DomEvent.disableClickPropagation(div);

    return div;
  };

  controlLeyenda.addTo(mapa);
}

function mostrarAnalisis(geojson, filtros) {
  const campo = obtenerCampo(filtros);
  const colores = paletas[filtros.option];

  const valores = geojson.features
    .map(feature => obtenerValor(feature.properties, campo))
    .filter(valor => valor !== null);

  const cortes = crearCortes(valores);

  if (capaMapa) {
    mapa.removeLayer(capaMapa);
  }

  capaMapa = L.geoJSON(geojson, {
    style: feature => {
      const valor = obtenerValor(feature.properties, campo);

      if (valor === null) {
        return estiloInicial;
      }

      const indice = obtenerIndice(valor, cortes);

      return {
        color: "#555555",
        weight: 0.8,
        fillColor: colores[Math.max(0, indice)],
        fillOpacity: 0.75
      };
    },

    onEachFeature: (feature, layer) => {
      const nombre = feature.properties?.name ?? "Unnamed zone";
      const valor = obtenerValor(feature.properties, campo);

      let contenido = "<b>" + escaparHTML(nombre) + "</b>";

      contenido += valor === null
        ? "<br>No data available"
        : "<br>" + escaparHTML(filtros.option) + ": " + valor;

      layer.bindPopup(contenido);
    }
  }).addTo(mapa);

  crearLeyenda(
    valores,
    cortes,
    colores,
    filtros.option + " - " +
      (filtros.hour === "Total"
        ? "Total"
        : filtros.hour.replace("_", ":"))
  );

  datosGeoJSON = geojson;
  filtrosAplicados = { ...filtros };

  actualizarResumen(filtros);

  estado.textContent = valores.length
    ? "Analysis updated successfully."
    : "No valid data available for the selected field.";
}

function actualizarResumen(filtros) {
  const periodo =
    catalogoCapas[filtros.year]?.[filtros.month];

  const nombreMes = periodo
    ? periodo.name
    : filtros.month;

  resumen.textContent =
    "Year: " + filtros.year +
    " | Month: " + nombreMes +
    " | Hour: " +
    (filtros.hour === "Total"
      ? "Total"
      : filtros.hour.replace("_", ":")) +
    " | Option: " + filtros.option;
}

async function actualizarSeleccion() {
  const solicitudActual = ++numeroSolicitud;
  const filtros = obtenerFiltros();

  actualizarResumen(filtros);

  let nombreCapa;

  try {
    nombreCapa = obtenerNombreCapa(filtros);
  } catch (error) {
    estado.textContent = error.message;
    return;
  }

  try {
    estado.textContent = "Loading " + nombreCapa + "...";

    const geojson = await cargarCapaQGIS(nombreCapa);

    // Ignore an outdated request if the user changed filters.
    if (solicitudActual !== numeroSolicitud) {
      return;
    }

    if (!mapaInicializado) {
      mostrarMapaInicial(geojson);
      return;
    }

    // Always render the currently selected layer.
    mostrarAnalisis(geojson, filtros);

  } catch (error) {
    if (solicitudActual !== numeroSolicitud) {
      return;
    }

    console.error("Manager Mode error:", error);

    estado.textContent =
      "Could not update the map. " + error.message;
  }
}

    selector.addEventListener("change", actualizarSeleccion);
monthSelector.addEventListener("change", actualizarSeleccion);
optionSelector.addEventListener("change", actualizarSeleccion);

    async function iniciarAplicacion() {
  estado.textContent = "Loading QGIS Cloud data...";

  try {
    const filtros = obtenerFiltros();
    const nombreCapa = obtenerNombreCapa(filtros);

    const geojson = await cargarCapaQGIS(nombreCapa);

    // Show the initial layer in grey.
    mostrarMapaInicial(geojson);

  } catch (error) {
    console.error("Initial loading error:", error);

    estado.textContent =
      "Could not load the initial layer: " + error.message;
  }
}

rellenarSelectoresFecha();

iniciarAplicacion();

window.addEventListener("resize", () => {
  mapa.invalidateSize();
});

setTimeout(() => mapa.invalidateSize(), 100);
  </script>
</body>
</html>
