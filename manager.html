
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaxiQaid - Manager Mode</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #222;
      height: 100vh;
      height: 100dvh;
    }

    header {
      flex: 0 0 auto;
      padding: 12px 22px;
      background: #F58220;
      color: white;
    }

    .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      background: white;
      border-radius: 5px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .controles {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .grupo {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 13px;
    }

    select,
    button {
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
    }

    select {
      border: 1px solid #ddd;
      background: white;
      color: #222;
    }

    button {
      cursor: pointer;
      border: 1px solid white;
      background: white;
      color: #B9570A;
      font-weight: bold;
    }

    button:hover {
      background: #fff0e3;
    }

    #backToManager {
      min-width: 125px;
    }

    #selector {
      min-width: 105px;
    }

    #yearSelector {
      min-width: 90px;
    }

    #monthSelector {
      min-width: 125px;
    }

    #optionSelector {
      min-width: 125px;
    }

    #estado {
      font-size: 13px;
      margin-top: 8px;
    }

    #resumen {
      font-size: 13px;
      margin-top: 4px;
    }

    #map {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      background: #e5e5e5;
    }

    @media (max-width: 650px) {
      header {
        padding: 10px 12px;
        max-height: 48vh;
        overflow-y: auto;
      }

      .cabecera {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .marca {
        gap: 10px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      h1 {
        font-size: 18px;
      }

      .controles {
        width: 100%;
        align-items: stretch;
        gap: 8px;
      }

      .grupo {
        flex: 1 1 110px;
        min-width: 0;
      }

      select,
      button {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="cabecera">

      <div class="marca">
        <img
          class="logo"
          src="./TaxiQaidLogo.jpg"
          alt="TaxiQaid Logo"
        >

        <h1>MANAGER MODE</h1>
      </div>

      <div class="controles">

        <div class="grupo">
          <label>&nbsp;</label>
          <button id="backToManager">OCC Mode</button>
        </div>

        <div class="grupo">
          <label for="selector">Select Hour:</label>
          <select id="selector">
            <option value="Total" selected>Total</option>
          </select>
        </div>

        <div class="grupo">
          <label for="yearSelector">Year:</label>
          <select id="yearSelector">
            <option value="2026" selected>2026</option>
          </select>
        </div>

        <div class="grupo">
          <label for="monthSelector">Month:</label>
          <select id="monthSelector">
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div class="grupo">
          <label for="optionSelector">Option:</label>
          <select id="optionSelector">
            <option value="Pick-Up" selected>Pick-Up</option>
            <option value="Drop-Off">Drop-Off</option>
            <option value="Total Trips">Total Trips</option>
          </select>
        </div>

      </div>
    </div>

    <div id="estado">Initializing map...</div>
    <div id="resumen"></div>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    "use strict";

    // QGIS Cloud service, retained for the next integration stage.
    const servicio =
      "https://wms.prod.qgiscloud.com/dohanyan16/TaxiQaid_Demand_Analysis";

    const mapa = L.map("map", {
      center: [21.3891, 39.8579],
      zoom: 12
    });

    // Satellite basemap.
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Imagery &copy; Esri",
        maxZoom: 19
      }
    ).addTo(mapa);

    const selector = document.getElementById("selector");
    const yearSelector = document.getElementById("yearSelector");
    const monthSelector = document.getElementById("monthSelector");
    const optionSelector = document.getElementById("optionSelector");
    const estado = document.getElementById("estado");
    const resumen = document.getElementById("resumen");

    // Populate the hour selector, including Total.
    selector.replaceChildren();

    const opcionTotal = document.createElement("option");
    opcionTotal.value = "Total";
    opcionTotal.textContent = "Total";
    opcionTotal.selected = true;
    selector.appendChild(opcionTotal);

    for (let h = 0; h < 24; h++) {
      const hora = String(h).padStart(2, "0");
      const campo = hora + "_00";
      const opcion = document.createElement("option");

      opcion.value = campo;
      opcion.textContent = hora + ":00";

      selector.appendChild(opcion);
    }

    // Return to the repository's occmanager.html page.
    document.getElementById("backToManager")
      .addEventListener("click", () => {
        window.location.href = "./occmanager.html";
      });

    // Collect the current filter selections.
    function obtenerFiltros() {
      return {
        hour: selector.value,
        year: yearSelector.value,
        month: monthSelector.value,
        option: optionSelector.value
      };
    }

    // The selectors are ready, but data filtering will be connected
    // once the new QGIS layers and their attribute fields are specified.
    function actualizarSeleccion() {
      const filtros = obtenerFiltros();

      estado.textContent =
        "Filters selected. QGIS analysis layers have not been connected yet.";

      resumen.textContent =
        "Year: " + filtros.year +
        " | Month: " +
        (filtros.month === "Total"
          ? "All months"
          : monthSelector.options[monthSelector.selectedIndex].text) +
        " | Hour: " +
        (filtros.hour === "Total"
          ? "All hours"
          : filtros.hour.replace("_", ":")) +
        " | Option: " + filtros.option;
    }

    selector.addEventListener("change", actualizarSeleccion);
    yearSelector.addEventListener("change", actualizarSeleccion);
    monthSelector.addEventListener("change", actualizarSeleccion);
    optionSelector.addEventListener("change", actualizarSeleccion);

    // Initial status.
    estado.textContent =
      "Map ready. Select the analysis filters.";

    actualizarSeleccion();

    // Keep this variable available for the next QGIS integration step.
    console.log("QGIS Cloud service configured:", servicio);

    // Correct map rendering if the page layout changes.
    window.addEventListener("resize", () => {
      mapa.invalidateSize();
    });

    setTimeout(() => mapa.invalidateSize(), 100);
  </script>
</body>
</html>
