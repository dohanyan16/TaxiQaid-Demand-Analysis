
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxiQaid</title>

  <style>
    /* Orange background */
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #F58220;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Main title */
    h1 {
      color: white;
      font-size: 42px;
      margin-bottom: 30px;
    }

    /* Login box */
    .login-box {
      background-color: white;
      width: 320px;
      max-width: calc(100% - 64px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-box h2 {
      color: #F58220;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* Input fields */
    .login-box input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #F58220;
      box-shadow: 0 0 4px rgba(245, 130, 32, 0.4);
    }

    /* Login button */
    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #F58220;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #D96A10;
    }
  </style>
</head>

<body>

  <h1>TaxiQaid</h1>

  <div class="login-box">
    <h2>Login</h2>

    <form>
      <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Sign In</button>
    </form>
  </div>

</body>
</html>
