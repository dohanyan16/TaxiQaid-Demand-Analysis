<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxiQaid</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #F58220;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      box-sizing: border-box;
      background: white;
      width: 380px;
      max-width: calc(100% - 40px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 100%;
      max-height: 120px;
      height: auto;
      object-fit: contain;
      margin: 0 auto 25px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #F58220;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #F58220;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #D96A10;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #error-message {
      color: #c62828;
      font-size: 14px;
      margin: 15px 0 0;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <img
      src="TaxiQaidLogo.jpg"
      alt="TaxiQaid Logo"
      class="logo"
    >

    <form id="login-form">
      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        autocapitalize="none"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="login-button" type="submit">
        Sign In
      </button>

      <p id="error-message" role="alert" hidden>
        Invalid username or password.
      </p>
    </form>
  </div>

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Replace these with your own Supabase project details.
    const SUPABASE_URL = "https://gycijhgmmaznvcoxphlh.supabase.co";
    const SUPABASE_PUBLIC_KEY = "sb_publishable_HzPfzuV-3Z-6aCuvGWcBHQ_R5gF7F7T";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("error-message");
    const loginButton = document.getElementById("login-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      errorMessage.hidden = true;
      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      try {
        // This assumes the Authentication email is:
        // lowercase username + @taxiqaiddemand.com
        const email =
          username.toLowerCase() + "@taxiqaiddemand.com";

        // Authenticate against Supabase, not against HTML passwords.
        const { data: authData, error: authError } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (authError) {
          throw authError;
        }

        // Obtain the role belonging to the authenticated user.
        const { data: profile, error: profileError } =
          await supabaseClient
            .from("taxiqaid_roles")
            .select("role")
            .eq("user_id", authData.user.id)
            .maybeSingle();

        if (profileError) {
          throw profileError;
        }

        if (!profile) {
          await supabaseClient.auth.signOut();
          throw new Error("No authorized role was found.");
        }

        const role = profile.role;

        if (role === "OCC") {
          window.location.replace("occ.html");
        } else if (role === "Manager") {
          window.location.replace("manager.html");
        } else {
          await supabaseClient.auth.signOut();
          throw new Error("The assigned role is not valid.");
        }

      } catch (error) {
        console.error("Login error:", error);

        errorMessage.textContent =
          "Unable to sign in. Check your credentials or contact the administrator.";

        errorMessage.hidden = false;
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
